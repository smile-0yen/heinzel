<!doctype html>
<html lang="ja" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>heinzel — 夜の運行</title>
<style>
:root{
  color-scheme: light dark;
  /* 運行図表（smile-monitor）と同じ約束。状態色は 3 つだけで、平常運転には
     色を与えない（ISA-101）。琥珀は明モードで contrast が 3:1 に届かないので、
     色だけで意味を運ばせず、必ずグリフと文字を併記する。 */
  --surface:#eef1ec; --surface-2:#e6eae3; --surface-3:#dbe1d8;
  --ink:#14171a; --ink-2:#495056; --ink-3:#767d83;
  --rule:#ccd3ca;
  --running:#2a78d6; --late:#c98500; --bad:#d03b3b;
  --plan:#9aa39c;
  --tap:44px;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    --surface:#141715; --surface-2:#1c201d; --surface-3:#262b27;
    --ink:#eef1ec; --ink-2:#b3bab4; --ink-3:#828b84;
    --rule:#343b36;
    --running:#3d89e0; --late:#b8860f; --bad:#bf3f3b;
    --plan:#5b645d;
  }
}
:root[data-theme="dark"]{
  --surface:#141715; --surface-2:#1c201d; --surface-3:#262b27;
  --ink:#eef1ec; --ink-2:#b3bab4; --ink-3:#828b84;
  --rule:#343b36;
  --running:#3d89e0; --late:#b8860f; --bad:#bf3f3b;
  --plan:#5b645d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;overflow-x:hidden;background:var(--surface);color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  padding-bottom:env(safe-area-inset-bottom)}
/* 収集に失敗したら、古い値を新しい顔で出さない。灰色に落として一目で分かるようにする。 */
body[data-stale="true"] main{opacity:.45;filter:grayscale(.7)}

header{position:sticky;top:0;z-index:10;background:var(--surface);
  padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));
  border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:10px}
h1{font-size:15px;margin:0;letter-spacing:.04em;white-space:nowrap}
.meta{color:var(--ink-3);font-size:11.5px;line-height:1.25;min-width:0}
.spacer{flex:1}
button{font:inherit;font-size:12.5px;min-height:32px;padding:5px 11px;
  border:1px solid var(--rule);border-radius:8px;background:var(--surface-2);
  color:var(--ink);cursor:pointer}
button:active{background:var(--surface-3)}
button:disabled{opacity:.45;cursor:default}
#banner{padding:10px 14px;font-weight:600;font-size:13.5px;display:none;gap:8px}
#banner[data-level]{display:flex}
#banner[data-level="warn"]{background:color-mix(in srgb,var(--late) 22%,var(--surface));
  border-bottom:2px solid var(--late)}
#banner[data-level="crit"]{background:color-mix(in srgb,var(--bad) 24%,var(--surface));
  border-bottom:2px solid var(--bad)}

main{padding:0 14px 48px}
section{margin-top:18px}
h2{font-size:11.5px;letter-spacing:.12em;color:var(--ink-3);margin:0 0 8px;
  font-weight:650;display:flex;align-items:baseline;gap:8px}
h2 .n{color:var(--ink-2);font-weight:600;letter-spacing:0}

#verdict{margin-top:14px;border:1px solid var(--rule);border-radius:14px;
  padding:14px 16px;background:var(--surface-2);display:flex;gap:13px;align-items:center}
#verdict[data-tone="bad"]{border-color:var(--bad);
  background:color-mix(in srgb,var(--bad) 12%,var(--surface-2))}
#verdict[data-tone="late"]{border-color:var(--late);
  background:color-mix(in srgb,var(--late) 12%,var(--surface-2))}
#verdict .g{font-size:30px;line-height:1}
#verdict[data-tone="bad"] .g{color:var(--bad)}
#verdict[data-tone="late"] .g{color:var(--late)}
#verdict .t{font-size:19px;font-weight:680;letter-spacing:-.01em}
#verdict .s{font-size:12.5px;color:var(--ink-2);margin-top:3px}

.card{border:1px solid var(--rule);border-radius:12px;background:var(--surface-2);
  padding:11px 13px;margin-bottom:8px}
.card[data-tone="bad"]{border-left:4px solid var(--bad)}
.card[data-tone="late"]{border-left:4px solid var(--late)}
.card .h{font-weight:640;font-size:14.5px;display:flex;gap:8px;align-items:center;
  flex-wrap:wrap}
.card .b{font-size:12.5px;color:var(--ink-2);margin-top:5px;overflow-wrap:anywhere}
.card .act{font-size:12.5px;margin-top:6px;color:var(--ink-3)}

.rows{border:1px solid var(--rule);border-radius:12px;overflow:hidden;
  background:var(--surface-2)}
.row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 9px;
  padding:9px 12px;border-bottom:1px solid var(--rule);min-height:var(--tap);
  align-items:center}
.row:last-child{border-bottom:none}
.row>.chip{grid-column:1;grid-row:1}
.row .nm{grid-column:2;grid-row:1;font-size:14px;font-weight:520;min-width:0;
  overflow-wrap:anywhere}
.row .foot{grid-column:1/-1;grid-row:2;display:flex;align-items:center;
  gap:10px;justify-content:space-between;min-width:0}
.row .sub{font-size:11.5px;color:var(--ink-3);min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.chip{display:inline-flex;align-items:center;justify-content:center;gap:4px;
  font-size:11px;font-weight:660;padding:2px 7px;border-radius:999px;
  border:1.5px solid currentColor;white-space:nowrap;line-height:1.35}
.chip[data-tone="bad"]{color:var(--bad)}
.chip[data-tone="late"]{color:var(--late)}
.chip[data-tone="running"]{color:var(--running)}
.chip[data-tone="calm"]{color:var(--ink-3)}
.chip .g{font-size:11px}

details{border:1px solid var(--rule);border-radius:12px;background:var(--surface-2);
  overflow:hidden}
details>summary{list-style:none;cursor:pointer;padding:11px 13px;font-size:12.5px;
  font-weight:620;color:var(--ink-2);display:flex;align-items:center;gap:8px;
  min-height:var(--tap)}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"▸";margin-left:auto;color:var(--ink-3)}
details[open]>summary::after{content:"▾"}
details .inner{padding:0 13px 13px}

table{border-collapse:collapse;width:100%;font-size:12.5px}
th{text-align:left;font-weight:620;color:var(--ink-3);font-size:11px;
  letter-spacing:.06em;padding:6px 6px;border-bottom:1px solid var(--rule)}
td{padding:7px 6px;border-bottom:1px solid var(--rule);vertical-align:top}
tr:last-child td{border-bottom:none}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}
.muted{color:var(--ink-3)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:12.5px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;overflow-wrap:anywhere}

/* 追加フォーム。読み取りと変更の境界をはっきりさせるため、
   このページで唯一書き込む場所として枠を分けてある。 */
form{border:1px solid var(--rule);border-radius:12px;background:var(--surface-2);
  padding:12px 13px}
label{display:block;font-size:11.5px;color:var(--ink-3);margin:0 0 4px;
  letter-spacing:.06em;font-weight:620}
input[type=text],textarea,select{width:100%;font:inherit;font-size:15px;
  padding:9px 10px;border:1px solid var(--rule);border-radius:9px;
  background:var(--surface);color:var(--ink);-webkit-appearance:none}
textarea{min-height:74px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--running);outline-offset:-1px}
.frow{display:flex;gap:9px;flex-wrap:wrap;margin-top:9px}
.frow>div{flex:1 1 140px}
.fsend{margin-top:11px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.fsend button{border-color:var(--running);color:var(--running);font-weight:640;
  min-height:var(--tap);padding:8px 16px}
#add-said{font-size:12.5px;color:var(--ink-2)}
#add-said[data-tone="bad"]{color:var(--bad)}

.legend{display:flex;gap:8px 12px;flex-wrap:wrap;font-size:11px;color:var(--ink-2);
  margin-top:8px;align-items:center;line-height:1.6}
.legend span{white-space:nowrap}
.legend i{display:inline-block;width:10px;height:12px;border-radius:2px;
  vertical-align:-2px;margin-right:4px}
.note{font-size:11.5px;color:var(--ink-3);margin:8px 2px 0}
#diagram-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
svg{display:block}

/* ── 幅の取り合いを起こさせない ─────────────────────────
   スマホで横に溢れると、body の overflow-x:hidden が黙って右端を切り落とす
   ——スクロールバーも出ないので、切れていること自体が画面から分からない。
   溢れうるのは 3 種類だけなので、その 3 つを名指しで押さえる。
     1. flex/grid の子は既定で min-width:auto、つまり中身より細くなれない
     2. <select> は最長の選択肢の幅を要求する（チェックアウト名は長い）
     3. 図は本来この幅に入らない。入れるのではなく、そこだけ横スクロールさせる */
main,section,.card,.rows,.row,form,details,header{min-width:0;max-width:100%}
.card .h{min-width:0}
.card .h>span{min-width:0;overflow-wrap:anywhere}
.row .foot>*{min-width:0}
.frow>div{min-width:0}
input[type=text],textarea,select{max-width:100%;min-width:0}

@media (min-width:820px){
  main{max-width:1240px;margin:0 auto;padding:0 22px 60px}
  body{font-size:14px}
  /* DOM の並びはスマホ最適のまま。広い画面でだけ 2 段組へ組み替える。
     左＝状態と操作、右＝待ち行列。 */
  .cols{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);
    column-gap:22px;align-items:start}
  .cols>section{margin-top:18px}
  #sec-session {grid-column:1;grid-row:1}
  #sec-add     {grid-column:1;grid-row:2}
  #sec-ws      {grid-column:1;grid-row:3}
  #sec-blocked {grid-column:2;grid-row:1}
  #sec-queue   {grid-column:2;grid-row:2/4}
  #sec-diagram {grid-column:1/-1;grid-row:4}
  #sec-runs    {grid-column:1/-1;grid-row:5}
}
</style>
</head>
<body>
<div id="banner" role="status" aria-live="polite"></div>
<header>
  <h1>heinzel</h1>
  <div class="meta" id="meta"></div>
  <span class="spacer"></span>
  <button id="btn-theme" aria-label="明暗を切り替え">◐</button>
  <button id="btn-refresh" aria-label="更新">↻ 更新</button>
</header>
<main>
  <div id="verdict" role="status"></div>

  <div class="cols">
    <section id="sec-session">
      <h2>セッション</h2>
      <div class="card"><dl class="kv" id="session"></dl></div>
    </section>

    <section id="sec-add">
      <h2>backlog に積む</h2>
      <form id="add-form" autocomplete="off">
        <label for="add-text">やってほしいこと</label>
        <textarea id="add-text" required
          placeholder="例: hzl schedule の出力に色を付ける"></textarea>
        <div class="frow">
          <div>
            <label for="add-prio">優先度</label>
            <select id="add-prio">
              <option value="1">P1 — 今週</option>
              <option value="2">P2</option>
              <option value="3" selected>P3</option>
              <option value="99">P99 — いつか</option>
            </select>
          </div>
          <div>
            <label for="add-ws">どのチェックアウト</label>
            <select id="add-ws"></select>
          </div>
        </div>
        <div class="fsend">
          <button type="submit" id="add-send">積む</button>
          <span id="add-said" role="status" aria-live="polite"></span>
        </div>
        <p class="note">このページが書き込むのはここだけ。`hzl add` を通るので、
          run が merge 中でも backlog のロックの内側に入る。id は run と同じ採番。</p>
      </form>
    </section>

    <section id="sec-ws">
      <h2>チェックアウト <span class="n" id="n-ws"></span></h2>
      <div class="rows" id="ws"></div>
    </section>

    <section id="sec-blocked">
      <h2>あなた待ち <span class="n" id="n-blocked"></span></h2>
      <div id="blocked"></div>
    </section>

    <section id="sec-queue">
      <h2>待ち行列 <span class="n" id="n-queue"></span></h2>
      <div class="rows" id="queue"></div>
      <div class="legend" id="legend"></div>
    </section>

    <section id="sec-diagram">
      <details id="d-diagram" open>
        <summary>運行図表 — 予定の枠と、実際に走った run</summary>
        <div class="inner">
          <div id="diagram-wrap"><svg id="diagram" role="img" aria-label="run の運行図表"></svg></div>
          <p class="note" id="diagram-note"></p>
        </div>
      </details>
    </section>

    <section id="sec-runs">
      <details id="d-runs">
        <summary>直近の run <span class="n" id="n-runs"></span></summary>
        <div class="inner" id="runs"></div>
      </details>
    </section>
  </div>
</main>
<script src="/app.js"></script>
</body>
</html>
