name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shell:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash version (must be the stock 3.2)
        run: /bin/bash --version | head -1

      # `lib/web/` holds the dashboard's JavaScript, HTML and the Python that
      # serves them. They are sources, but they are not shell, and handing them
      # to `bash -n` fails on the first line of every one of them. Named by
      # what they are rather than excluded by name, so a second .py does not
      # turn CI red on the day it lands.
      - name: list the shell sources
        run: |
          # The trailing -print is load-bearing: find drops the implicit one
          # as soon as the expression contains -exec, and the list comes back
          # empty with nothing to say it went wrong.
          find bin lib tests tools -type f \
            \( -name '*.sh' -o -exec grep -Iq '^#!.*sh' {} \; \) -print \
            2>/dev/null | sort >/tmp/shell-sources
          cat /tmp/shell-sources

      - name: syntax check under bash 3.2
        run: |
          found=0
          while IFS= read -r f; do
            found=1
            /bin/bash -n "$f" || exit 1
          done </tmp/shell-sources
          if [ "$found" -eq 0 ]; then
            echo "no shell sources yet (design phase) — skipping"
          fi

      - name: shellcheck
        run: |
          if [ -s /tmp/shell-sources ]; then
            brew install shellcheck
            # -x so sourced libraries are followed from their entry points.
            # SC2034 is excluded: almost everything in lib/ is assigned there
            # and consumed by the scripts that source it, which shellcheck
            # cannot see when it analyses a file on its own.
            shellcheck --shell=bash --severity=warning -x -e SC2034 \
              $(cat /tmp/shell-sources) install.sh
          else
            echo "no shell sources yet (design phase) — skipping"
          fi

      # The Go half is built before the shell suite runs, because the suite is
      # not meaningful without it: every engine launch and every usage probe
      # goes through bin/hzl-exec. A CI that ran the shell tests first would
      # report a hundred failures whose single cause was a missing build.
      - name: go version (must satisfy HEINZEL_GO_MIN)
        run: |
          go version
          min=$(sed -n 's/^HEINZEL_GO_MIN="\(.*\)"/\1/p' lib/common.sh)
          have=$(go version | sed -n 's/^go version go\([0-9][0-9]*\.[0-9][0-9]*\).*$/\1/p')
          printf 'want %s or newer, have %s\n' "${min}" "${have}"
          # The same comparison lib/common.sh makes, so CI cannot pass a
          # toolchain `hzl build` would refuse.
          [ "$(( 10#${have%%.*} * 1000 + 10#${have#*.} ))" \
            -ge "$(( 10#${min%%.*} * 1000 + 10#${min#*.} ))" ]

      - name: gofmt
        run: |
          unformatted=$(gofmt -l go/)
          if [ -n "${unformatted}" ]; then
            printf 'not gofmt-clean:\n%s\n' "${unformatted}" >&2
            exit 1
          fi

      - name: go vet
        working-directory: go
        run: go vet ./...

      - name: go test
        working-directory: go
        run: go test ./...

      - name: build bin/hzl-exec
        run: |
          version=$(sed -n 's/^HEINZEL_VERSION="\(.*\)"/\1/p' lib/common.sh)
          ( cd go && go build -o ../bin/hzl-exec \
              -ldflags "-X main.heinzelVersion=${version}" . )
          [ "$(bin/hzl-exec version)" = "${version}" ]

      - name: tests
        run: |
          if [ -x tests/test.sh ]; then
            tests/test.sh
          else
            echo "no tests yet (design phase) — skipping"
          fi
